<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>全功能互動教學預覽</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="project-tutorial.css">
</head>
<body>
  <section style="max-width:760px;margin:10vh auto;padding:28px">
    <h1>Company AI・全功能互動教學預覽</h1>
    <p>依功能分類挑選教學，或搜尋想學的操作。每個主題都是獨立練習。</p>
    <p>這是離線預覽視窗，不需要登入。不會呼叫 AI、建立真專案或讀取你的資料。</p>
    <button id="preview-start" type="button" class="primary-button">選擇教學</button>
    <p id="preview-status" role="status"></p>
    <p>正式介面的入口：設定 → 教學與更新日誌。</p>
  </section>
  <script src="tutorial-lessons.js"></script>
  <script src="project-tutorial.js"></script>
  <script src="tutorial-preview.js"></script>
</body>
</html>
