[package]
name = "company-ai"
version = "0.2.1"
edition = "2021"
rust-version = "1.98"

# 每個應用程式是自己的 workspace，依賴鎖定與編譯輸出不與其他專案混用。
[workspace]
resolver = "2"

[profile.release]
strip = "debuginfo"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
