[package]
name = "company-ai"
version = "0.9.19"
edition = "2021"
rust-version = "1.98"

# 每個應用程式是自己的 workspace，依賴鎖定與編譯輸出不與其他專案混用。
[workspace]
resolver = "2"

[features]
# 正式發行維持完整功能；精簡建置使用 --no-default-features 明確選擇。
default = ["cad", "pet", "tarot", "vnc"]
cad = []
pet = []
tarot = []
vnc = []

[[example]]
name = "vnc_smoke"
required-features = ["vnc"]

[profile.release]
strip = "debuginfo"
# 實測比較與限制見 docs/development/RELEASE_PROFILES.md；保留回呼 panic 回復能力。
lto = "thin"
codegen-units = 16
panic = "unwind"

[dev-dependencies]
# 記憶體 COM 回歸測試的 implement 巨集需要直接引用；與 windows 既有版本一致。
windows-core = "=0.62.2"

[dependencies]
# PDF 文字擷取編入 EXE，在既有 AppContainer 執行，不依賴 Python。
pdf-extract = "=0.12.1"
serde = { version = "1.0", features = ["derive"] }
# 科學數值封存必須精確還原 f64，避免重新編碼後雜湊誤判。
serde_json = { version = "1.0", features = ["float_roundtrip"] }
url = "2.5"
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Accessibility"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_NetworkManagement_WNet",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
